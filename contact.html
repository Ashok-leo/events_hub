<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub — Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        footer {
            background: #0f172a;
            color: white;
        }
    </style>
</head>

<body>
    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html" title="Go to home page">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container py-4">
            <div class="card">
                <div class="card-body">

                    <h2 class="card-title">Contact Us</h2>

                    <h3>College Address</h3>
                    <p>Jigme Namgyel Engineering College, Deothang, Bhutan</p>

                    <h3>Email</h3>
                    <p>
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:info@jnec.edu.bt">info@jnec.edu.bt</a>
                    </p>

                    <h3>Phone</h3>
                    <p>
                        <i class="fa-solid fa-phone"></i>
                        Phone: +975 07 361 200
                    </p>

                    <h3>Find Us</h3>
                    <div class="ratio ratio-16x9 border rounded shadow-sm">
                        <iframe
                            src="https://www.google.com/maps"
                            title="JNEC map"
                            allowfullscreen
                            loading="lazy">
                        </iframe>
                    </div>

                    <h3>Enquiry Form</h3>
                    <form action="#" method="post">
                        <label>Name:</label>
                        <input type="text" name="name" required><br><br>

                        <label>Email:</label>
                        <input type="email" name="email" required><br><br>

                        <label>Message:</label>
                        <textarea name="message" rows="4"></textarea><br><br>

                        <button type="submit">Submit</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
